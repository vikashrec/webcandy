name: Authorized Facebook Page Job Search
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Use sample data only (no Facebook API request)'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: fb-page-job-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
      - name: Offline sample dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: node scripts/dry-run.mjs
      - name: Check authorized collection configuration
        id: preflight
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          PRIVATE_LEADS_ENDPOINT: ${{ vars.PRIVATE_LEADS_ENDPOINT }}
          PRIVATE_LEADS_TOKEN: ${{ secrets.PRIVATE_LEADS_TOKEN }}
        run: |
          if [[ -n "$FB_PAGE_ACCESS_TOKEN" && -n "$FB_PAGE_ID" && -n "$PRIVATE_LEADS_ENDPOINT" && -n "$PRIVATE_LEADS_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Authorized Page collection and private storage configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Collection skipped: Page access and/or private storage not configured."
          fi
      - name: Collect authorized Page posts
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
          PRIVATE_LEADS_ENDPOINT: ${{ vars.PRIVATE_LEADS_ENDPOINT }}
          PRIVATE_LEADS_TOKEN: ${{ secrets.PRIVATE_LEADS_TOKEN }}
        run: node scripts/search.mjs
